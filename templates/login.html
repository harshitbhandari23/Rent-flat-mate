{% extends "base.html" %}
{% block title %}Login | RentFlat{% endblock %}
{% block content %}
<div style="display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;">
<div>
<h1 style="font-size:42px;color:#111827;margin-bottom:10px;">Welcome Back 👋</h1>
<p style="color:#6B7280;font-size:18px;margin-bottom:30px;">Login to discover verified rooms and compatible flatmates.</p>
<div style="background:#fff;border-radius:20px;padding:35px;box-shadow:0 10px 30px rgba(0,0,0,.08);">
<form method="POST">
<label>Email</label>
<input type="email" name="email" placeholder="Enter email" required>
<label>Password</label>
<input type="password" name="password" placeholder="Enter password" required>
<button class="btn btn-primary" style="width:100%;margin-top:8px;">Login</button>
</form>
<p style="margin-top:20px;text-align:center;color:#6B7280;">Don't have an account?
<a href="{{ url_for('register') }}" style="color:#FF5A5F;font-weight:600;">Create one</a></p>
</div>
</div>
<div style="text-align:center;">
<img src="https://images.unsplash.com/photo-1460317442991-0ec209397118?w=800" style="width:100%;border-radius:24px;box-shadow:0 20px 50px rgba(0,0,0,.15);">
</div>
</div>
{% endblock %}
