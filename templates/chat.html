{% extends "base.html" %}
{% block title %}Chat{% endblock %}
{% block head %}
<script src="{{ url_for('static', filename='js/socket.io.min.js') }}"></script>
<style>
.chatbox{background:#fff;border-radius:20px;box-shadow:0 10px 25px rgba(0,0,0,.08);overflow:hidden}
.head{background:#FF5A5F;color:#fff;padding:18px;font-size:22px}
.messages{height:420px;overflow-y:auto;padding:20px;background:#FFF7F7}
.msg{background:#fff;padding:12px 16px;border-radius:14px;margin-bottom:12px;max-width:75%}
.meta{font-size:12px;color:#777;margin-bottom:4px}
.send{display:flex;padding:15px;border-top:1px solid #eee;gap:10px}
.send input{flex:1;margin:0}
</style>
{% endblock %}
{% block content %}
<div class="chatbox">
<div class="head">Conversation</div>
<div class="messages" id="messages">
{% for msg in messages %}
<div class="msg">
<div class="meta">{{ msg.created_at.strftime('%H:%M') }}</div>
{{ msg.content }}
</div>
{% endfor %}
</div>
<div class="send">
<input id="text" placeholder="Type a message...">
<button class="btn btn-primary" onclick="sendMsg()">Send</button>
</div>
</div>
{% endblock %}
{% block scripts %}
<script>

window.onload = function () {

    var socket = io();

    socket.emit("join", {
        match_id: {{ match.id }}
    });

    socket.on("receive_message", function(data) {

        const m = document.getElementById("messages");

        m.innerHTML += `
        <div class="msg">
            <div class="meta">${data.sender_name} • ${data.time}</div>
            ${data.content}
        </div>`;

        m.scrollTop = m.scrollHeight;
    });

    window.sendMsg = function () {

        const t = document.getElementById("text");

        if (t.value.trim() === "") return;

        socket.emit("send_message", {
            match_id: {{ match.id }},
            sender_id: {{ current_user.id }},
            sender_name: "{{ current_user.name }}",
            content: t.value
        });

        t.value = "";
    };

};

</script>
{% endblock %}
